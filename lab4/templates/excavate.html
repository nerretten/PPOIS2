{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Выберите место раскопок</h2>
        <div class="list-group shadow-sm">
            {% for formation in formations %}
            <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
                <div>
                    <h5 class="mb-1">{{ formation.name }}</h5>
                    <p class="mb-0 text-muted small">
                        Сложность: {{ formation.difficulty.name }} |
                        Осталось костей: {{ formation.buried_fossils|length }}
                    </p>
                </div>
                <form action="/excavate" method="post">
                    <input type="hidden" name="formation_id" value="{{ loop.index0 }}">
                    <button type="submit" class="btn btn-success" {% if formation.is_empty() %}disabled{% endif %}>
                        Копать (-10 ⚡)
                    </button>
                </form>
            </div>
            {% endfor %}
        </div>
        <div class="mt-4">
            <a href="/" class="text-decoration-none">← Вернуться в лагерь</a>
        </div>
    </div>
</div>
{% endblock %}
